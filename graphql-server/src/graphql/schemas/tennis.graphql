# Tennis GraphQL Types

enum TennisTour {
  ATP
  WTA
  ITF
}

enum TennisRankingType {
  SINGLES
  DOUBLES
}

enum TennisSurface {
  HARD
  CLAY
  GRASS
  INDOOR_HARD
}

enum TournamentCategory {
  GRAND_SLAM
  MASTERS_1000
  WTA_1000
  ATP_500
  WTA_500
  ATP_250
  WTA_250
  ATP_FINALS
  WTA_FINALS
}

enum MatchStatus {
  SCHEDULED
  LIVE
  COMPLETED
  RETIRED
  WALKOVER
  DEFAULTED
  POSTPONED
  CANCELLED
}

enum TennisEnvironment {
  INDOOR
  OUTDOOR
  UNKNOWN
}

enum TennisEventStatus {
  UPCOMING
  ACTIVE
  COMPLETED
  CANCELLED
  UNAVAILABLE
}

type TennisProvenance {
  provider: String!
  providerId: String!
  fetchedAt: String!
  isStale: Boolean!
}

type TennisCompetitorV2 {
  otwId: ID!
  providerId: String!
  name: String!
  countryCode: String
  seed: Int
}

type TennisSetScoreV2 {
  setNumber: Int!
  player1Games: Int!
  player2Games: Int!
  player1Tiebreak: Int
  player2Tiebreak: Int
}

type TennisEventV2 {
  otwId: ID!
  providerId: String!
  tour: TennisTour!
  organizer: String!
  name: String!
  season: Int!
  edition: String
  category: String
  surface: String!
  environment: TennisEnvironment!
  location: String
  timezone: String!
  startsAt: String
  endsAt: String
  status: TennisEventStatus!
  provenance: TennisProvenance!
}

type TennisMatchV2 {
  otwId: ID!
  providerId: String!
  eventId: ID!
  tour: TennisTour!
  organizer: String!
  season: Int!
  round: String
  scheduledAt: String
  timezone: String!
  status: MatchStatus!
  competitors: [TennisCompetitorV2!]!
  winnerId: ID
  scoreText: String
  sets: [TennisSetScoreV2!]!
  provenance: TennisProvenance!
}

type DavisCupNation {
  code: String!
  name: String!
}

type DavisCupRubber {
  otwId: ID!
  providerId: String!
  order: Int!
  matchType: String!
  status: MatchStatus!
  homeCompetitors: [String!]!
  awayCompetitors: [String!]!
  winnerSide: String
  scoreText: String
  provenance: TennisProvenance!
}

type DavisCupTie {
  otwId: ID!
  providerId: String!
  eventId: ID!
  stage: String!
  group: String
  knockout: Boolean!
  home: DavisCupNation!
  away: DavisCupNation!
  neutralVenue: Boolean!
  venue: String
  scheduledAt: String
  status: MatchStatus!
  homeScore: Int
  awayScore: Int
  rubbers: [DavisCupRubber!]!
  provenance: TennisProvenance!
}

type DavisCupEvent {
  otwId: ID!
  providerId: String!
  organizer: String!
  name: String!
  season: Int!
  status: TennisEventStatus!
  ties: [DavisCupTie!]!
  provenance: TennisProvenance!
  availabilityMessage: String!
}

type TennisRanking {
  rank: Int!
  previousRank: Int!
  movement: String!
  playerName: String!
  playerId: String!
  country: String!
  countryCode: String!
  points: Int!
  tournamentsPlayed: Int!
  pointsDropping: Int!
  nextBestPoints: Int!
  tour: TennisTour!
  type: TennisRankingType!
  player: TennisPlayer
}

type TennisPlayer {
  id: String!
  firstName: String!
  lastName: String!
  fullName: String!
  country: String!
  countryCode: String!
  birthDate: String!
  birthPlace: String!
  height: Int
  weight: Int
  turnedPro: Int!
  plays: String!
  backhand: String!
  coach: String
  currentRanking: Int!
  highestRanking: Int!
  highestRankingDate: String!
  careerTitles: Int!
  careerWins: Int!
  careerLosses: Int!
  ytdWins: Int!
  ytdLosses: Int!
  prizeMoney: Float!
}

type TournamentPoints {
  winner: Int!
  finalist: Int!
  semifinalist: Int!
  quarterfinalist: Int!
  round16: Int!
  round32: Int!
  round64: Int
  round128: Int
}

type TennisTournament {
  id: String!
  name: String!
  location: String!
  country: String!
  surface: TennisSurface!
  category: TournamentCategory!
  startDate: String!
  endDate: String!
  prizeMoney: Float!
  currency: String!
  drawSize: Int!
  points: TournamentPoints!
}

type MatchPlayer {
  id: String!
  name: String!
  seed: Int
  countryCode: String!
}

type SetTiebreak {
  player1: Int!
  player2: Int!
}

type SetScore {
  player1: Int!
  player2: Int!
  tiebreak: SetTiebreak
}

type MatchScore {
  sets: [SetScore!]!
  winner: String
  retired: Boolean
  walkover: Boolean
}

type TennisMatch {
  id: String!
  tournamentId: String!
  tournamentName: String!
  round: String!
  surface: String!
  player1: MatchPlayer!
  player2: MatchPlayer!
  score: MatchScore
  formattedScore: String
  scheduledTime: String
  completedTime: String
  status: MatchStatus!
  court: String
  duration: Int
  tournament: TennisTournament
}

extend type Query {
  tennisEventsV2(tour: TennisTour!, season: Int): [TennisEventV2!]!
  tennisMatchesV2(
    tour: TennisTour!
    season: Int
    tournamentId: String
    playerId: String
    status: MatchStatus
    date: String
    limit: Int
  ): [TennisMatchV2!]!
  davisCupEvent(season: Int!): DavisCupEvent!
  davisCupTies(season: Int!): [DavisCupTie!]!

  # Tennis Rankings
  tennisRankings(tour: TennisTour, type: TennisRankingType, limit: Int): [TennisRanking!]!

  # Tennis Tournaments
  tennisTournaments(tour: TennisTour, year: Int, surface: TennisSurface, category: TournamentCategory): [TennisTournament!]!
  tennisTournament(tournamentId: String!): TennisTournament

  # Tennis Matches
  tennisMatches(tour: TennisTour = ATP, tournamentId: String, playerId: String, status: MatchStatus, date: String): [TennisMatch!]!
  tennisLiveMatches: [TennisMatch!]!

  # Tennis Players
  tennisPlayer(playerId: String!): TennisPlayer
}
